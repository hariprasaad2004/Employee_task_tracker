<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Task Tracker</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar" id="sidebar">

<button id="backBtn" class="back-btn">← Back</button>

<h2>Task Manager</h2>

<button id="dashboardBtn">Dashboard</button>
<button id="addTaskNavBtn">Add Task</button>
<button id="overviewBtn">Overview</button>
<button id="pendingBtn">Pending</button>
<button id="completedBtn">Completed</button>

</div>


<!-- Main Content -->

<div class="main-content">

<div class="topbar">

<button id="menuBtn">☰</button>

</div>

<!-- Dashboard -->

<div class="stats" id="dashboardStats">

<div class="card">
<h3>Total Tasks</h3>
<p id="totalTasks">0</p>
</div>

<div class="card">
<h3>Pending</h3>
<p id="pendingTasks">0</p>
</div>

<div class="card">
<h3>Completed</h3>
<p id="completedTasks">0</p>
</div>

</div>


<!-- Task Form -->

<div class="task-form" id="taskForm">

<input type="text" id="taskName" placeholder="Task Name">

<select id="priority">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<input type="date" id="dueDate">

<button id="addTaskBtn">Save Task</button>

</div>


<!-- Task Table -->

<div class="table-wrapper">

<table class="task-table">

<thead>
<tr>
<th>Task</th>
<th>Priority</th>
<th>Status</th>
<th>Due Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="taskList"></tbody>

</table>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
